name: Publicar no GitHub Pages

# O site é HTML, CSS e JavaScript puro, sem etapa de build. Este fluxo existe
# só para publicar a pasta site/, porque o Pages servindo direto do branch
# aceita apenas a raiz ou docs/, e a pasta site/ precisa continuar sendo a
# pasta limpa que vai para o ar em qualquer hospedagem.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
